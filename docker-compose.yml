services:
  consul:
    image: hashicorp/consul:1.18
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    networks:
      - vaultnet

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/file
    command: server
    depends_on:
      - consul
    networks:
      - vaultnet

  app:
    build: ./app
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_TOKEN:-}
    ports:
      - "5000:5000"
    depends_on:
      - vault
    networks:
      - vaultnet

networks:
  vaultnet:

volumes:
  vault_data:
